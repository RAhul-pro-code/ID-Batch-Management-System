spring.application.name=demo
# Server Configuration
server.port=9090

# Database Configuration

# Database Configuration
# To use H2 in-memory (default for quick testing), uncomment the following H2 lines:
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# To use MySQL, provide a running MySQL instance and update the URL/credentials below.
# Example URL creates DB if missing (MySQL 8+):
spring.datasource.url=jdbc:mysql://localhost:3306/idms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=change_me
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled when using MySQL, enable if needed)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.example.demo=DEBUG