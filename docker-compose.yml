version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: idms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: idms_db
      MYSQL_USER: idms_user
      MYSQL_PASSWORD: idms_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
